    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.66s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="180" r="2" fill="#d4ad3f">
    <animate attributeName="r" values="2;3.5;2" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="230" r="2" fill="#d4ad3f">
    <animate attributeName="r" values="2;3.5;2" dur="2s" begin="1.33s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.33s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="230" r="2" fill="#d4ad3f">
    <animate attributeName="r" values="2;3.5;2" dur="2s" begin="1.66s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.66s" repeatCount="indefinite"/>
  </circle>
