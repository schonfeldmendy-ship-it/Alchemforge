    <path d="M-22 14 Q-10 4 0 14" stroke="#b8902b" stroke-width="1.5" fill="none"/>
    <line x1="8" y1="-8" x2="22" y2="-8" stroke="#14120e" stroke-width="1"/>
    <line x1="8" y1="-2" x2="22" y2="-2" stroke="#b8902b" stroke-width="1"/>
    <line x1="8" y1="4" x2="18" y2="4" stroke="#b8902b" stroke-width="1"/>
    <text x="0" y="36" font-family="DM Mono, monospace" font-size="8" fill="#b8902b" text-anchor="middle" letter-spacing="1">CRM</text>
